name: Publish management UI
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/build_pages.py'
      - 'tools/check_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - name: Test desktop and mobile at the project path
        run: CHROMIUM_PATH="$(command -v google-chrome)" python tools/check_pages.py
      - run: python tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publish
        id: publication
        uses: actions/deploy-pages@v4
