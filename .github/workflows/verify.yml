name: Verify console and speaker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --check web/app.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - name: Exercise the console on desktop and mobile
        run: CHROMIUM_PATH="$(command -v google-chrome)" python tools/check_ui.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - name: Compile ESP32 S3 speaker
        run: |
          index=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$index"
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls "$index"
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc firmware/sleep_speaker
  rufield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ruvnet/rufield
          ref: 82ffc267617c59b91d32f7fcfc77896988fd0012
          path: upstream
          persist-credentials: false
      - run: cargo build --locked --manifest-path upstream/Cargo.toml -p rufield-viewer
      - run: python3 tools/check_viewer.py upstream/target/debug/rufield-viewer
